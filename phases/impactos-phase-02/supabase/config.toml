# Supabase CLI configuration for local development (`npm run db:start`).
# Production and staging are separate Supabase projects in the Mumbai region (ap-south-1).
project_id = "impactos"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://app.localhost:3000"
additional_redirect_urls = ["http://app.localhost:3000/api/auth/callback", "http://console.localhost:3000/api/auth/callback"]
minimum_password_length = 10
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
otp_length = 6

[auth.email.template.invite]
subject = "You are invited to ImpactOS"

[auth.mfa]
max_enrolled_factors = 5

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_SIGNIN_CLIENT_ID)"
secret = "env(GOOGLE_SIGNIN_CLIENT_SECRET)"
skip_nonce_check = false

# Bilingual auth emails through the app (see supabase/templates/README.md). Enable once SEND_EMAIL_HOOK_SECRET is set.
[auth.hook.send_email]
enabled = false
uri = "http://host.docker.internal:3000/api/auth/email-hook"
secrets = "env(SEND_EMAIL_HOOK_SECRET)"
